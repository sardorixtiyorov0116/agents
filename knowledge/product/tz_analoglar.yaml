# TZ qatori -> Climavent KP nomi (qoralama uchun).
#
# NEGA KERAK
# ----------
# TZ da loyihachi raqib yoki umumiy nom yozadi: «Огнезадерживающий клапан
# КЛОП-1 (Н/О) … FD 125x100», «Альюминевые решетка 4АПР-450х450мм.»,
# «Канальный вентилятор KV315M». Menejer har birini qo'lda Climavent
# nomiga aylantiradi. Bu jadval shu ishni qoralama sifatida qiladi.
#
# MANBA — TAXMIN EMAS: har qolip menejer KP laridan olingan
# (tests/etalon_tz/, 2026-10-03). Qaysi KP dan — `manba` da.
#
# Bu `loyiha_qisqartmalari.yaml` ni ALMASHTIRMAYDI: u bo'lim sarlavhasi
# («Решетка АДН») bo'yicha ishlaydi va BIRINCHI qo'llanadi. Bu jadval —
# nom qatorning o'zida bo'lganda (spetsifikatsiya, zayavka).
#
# QOLIP O'RINLARI
#   {olcham}  «300х200» yoki dumaloq bo'lsa «Ф200»
#   {d}       diametr yoki modeldagi raqam (Д125 -> 125, KV315M -> 315)
#   {ei}      olovbardoshlik: TZ da «EI60» bo'lsa o'sha, bo'lmasa `ei_standart`
#             va ogohlantirish (jimgina qo'yilmaydi)
#   {uzunlik} 3-o'lcham («250*150*1000» -> 1000), yo'q bo'lsa `uzunlik_standart`
#
# MAYDONLAR
#   agar:     TZ matni bo'yicha regex — qaysi qolip olinishi (birinchi mosi)
#   tanlov:   true — avtomatik nom YASALMAYDI, qator asl nomi bilan qoladi va
#             «parametr bo'yicha tanlash kerak» deb belgilanadi (VRF,
#             radial ventilyator — bular muhandis tanlovi).
#   olchamlar/ortiq_foizi/qolip: КЦКП — o'lcham sarfdan (`kp/kckp.py`).
#   eng_kichik: shundan kichik o'lcham kattalashtiriladi va OGOHLANTIRILADI.

ei_standart: "60"
uzunlik_standart: "1000"

analoglar:

  kpu:
    manba: "KP 12748 (КЛОП-1 -> КПУ-НО), KP 13357"
    # Katalog 2021, КПУ: EI 15, 30, 60, 90, 120, 180.
    ei_qatori: [15, 30, 60, 90, 120, 180]
    qoliplar:
      - qolip: "Клапан противопожарный КПУ-НО-Н-EI{ei}-{olcham}-КН-НУП-ЭМ-220"

  # КПД — TUTUN klapani: katalog 2021 (207-bet) va saytda faqat КПД (60) va
  # КПД (90), belgisi «E» (zichlik yo'qotish chegarasi), «EI» emas — namuna:
  # «КПД-НЗ-H-E60-500x400-КН-НУП-ЭР-…». Menejer 13603 da «EI120» yozgan —
  # katalogda yo'q. TZ 90 dan ko'p so'rasa E90 qo'yiladi va OGOHLANTIRILADI.
  kpd:
    manba: "Katalog 2021 207-bet; KP 13603 (КПД4-01 -> КПД-НЗ), KP 12748 (Клапан-(НЗ) -> КПД-НЗ)"
    ei_qatori: [60, 90]
    qoliplar:
      - qolip: "Клапан противопожарный КПД-НЗ-Н-E{ei}-{olcham}-КН-НУП-ЭР-220v"

  dks:
    manba: "KP 12748, KP 13357"
    qoliplar:
      - agar: 'CAV|СAV|постоянн\w*\s+объем'
        qolip: "Дроссель клапан ДКСп {olcham}"
        ogohlantirish: "TZ da doimiy sarf (CAV) rostlagichi so'ralgan — oddiy ДКСп emas, tekshiring"
      - qolip: "Дроссель клапан ДКСп {olcham}"

  kop:
    manba: "KP 12748 (Обратный клапан -> КОП)"
    qoliplar:
      - qolip: "Клапан обратный КОП {olcham}"

  panjara_shift:
    manba: "KP 12748 (4АПР -> 4РВП без КРВ)"
    eng_kichik: "300х300"
    qoliplar:
      - agar: 'с\s*КРВ|с\s+клапан'
        qolip: "Решетка вентиляционная потолочная 4РВП {olcham}мм с КРВ"
      - qolip: "Решетка вентиляционная потолочная 4РВП {olcham}мм без КРВ"

  panjara_devor:
    manba: "KP 12748 (АРС 1700х150 -> РВР-2 1700х150, АДР -> РВР-2 без КРВ)"
    qoliplar:
      - agar: 'с\s*КРВ|с\s+клапан'
        qolip: "Решетка вентиляционная регулируемая РВР-2 {olcham}мм с КРВ"
      - qolip: "Решетка вентиляционная регулируемая РВР-2 {olcham}мм без КРВ"

  diffuzor:
    manba: "KP 12748 (ДПУ-М ∅100 -> ДФА 100)"
    qoliplar:
      - qolip: "Диффузор веерный ДФА {d}"

  panjara_tashqi:
    manba: "KP 12748 (РВН-Решетка наружная 400x350 -> РВН 400х350мм)"
    qoliplar:
      - qolip: "Решетка вентиляционная наружная РВН {olcham}мм"

  panjara_metall:
    manba: "KP 12748 (РКДМ -> декоративный), KP 13357 (пожарний -> РМ-Д-ОЦ)"
    qoliplar:
      - agar: 'пожарн'
        qolip: "Решетка металлическая РМ-Д-ОЦ-{olcham}-НС-У1-СТ"
      - qolip: "Решетка металлическая декоративный {olcham}"

  shovqin:
    manba: "KP 13603 (250*150*1000 ГТП1-3 -> ГТП 250х150-1000)"
    qoliplar:
      - qolip: "Шумоглушитель трубчатый прямоугольный ГТП {olcham}-{uzunlik}"

  vent_kanal:
    manba: "KP 13603 (KV315M -> ВК-315С; ВЕНТС ТТ ПРО 250 -> MF-250P)"
    qoliplar:
      # ВЕНТС ТТ ПРО (aralash oqimli) -> MF-P, menejer 13603 dagidek.
      - agar: 'ТТ\s*ПРО|TT\s*PRO'
        qolip: "Вентилятор канальный MF-{d}P"
      - qolip: "Вентилятор канальный ВК-{d}С"
        ogohlantirish: "Kanal ventilyatori diametri bo'yicha olindi — ВК-С yoki MF-P, sarf va bosimni tekshiring"

  vent_maishiy:
    manba: "KP 13603 — menejer KP ga KIRITMAGAN (Climavent ishlab chiqarmaydi)"
    # KP ga QO'SHILMAYDI — menejerga «kiritilmadi» deb aytiladi.
    kpga_kirmaydi: true
    izoh: "Maishiy ventilyator (Compact) — Climavent ishlab chiqarmaydi"

  rekuperator:
    manba: "KP 13508 (VENCO-VHR-25/20 -> РКВ1-260)"
    tanlov: true
    izoh: "Rekuperator sarf bo'yicha tanlanadi (РКВ)"

  # КЦКП o'lchami — SARFDAN (`kp/kckp.py`). Nominal sarfdan `ortiq_foizi`
  # gacha oshsa ham o'sha o'lcham: 10250 -> КЦКП-10, 33000 -> КЦКП-31,5;
  # oshsa — keyingisi: 4500 -> 5, 9000 -> 10. O'lchamlar — katalogdagi
  # КЦКП modellari (1,6 … 100). Sarf yo'q yoki 105 000 dan katta — tanlov.
  kckp:
    manba: "KP 13603 (3000 -> 3,15; 1100 -> 1,6), KP 13574 (VENTAS, 16 qurilma)"
    olchamlar: [1.6, 3.15, 5, 6.3, 8, 10, 12.5, 16, 20, 25, 31.5, 40, 50, 63, 80, 100]
    ortiq_foizi: 5
    qolip: "Кондиционер КЦКП-{olcham}"
    # Katalog 2021, КЦКП «блок вентилятора»: ebmpapst modeli BITTA bo'lgan
    # o'lchamlar (8 dan boshlab 2–3 variant — tanlov, yozilmaydi).
    # Menejer 13603: КЦКП-3,15 -> K3G310, КЦКП-1,6 -> K3G250 — shu jadvaldan.
    ventilyator:
      "1,6": "K3G250-AV29-B2"
      "3,15": "K3G310-PH38-02"
      "5": "K3G310-PH58-02"
      "6,3": "K3G400-PA27-71"
    # EC ventilyator (ebmpapst) yuqori bosimga chiqmaydi: menejer 13574 da
    # AHU-10 (КЦКП-3,15, 1185 Pa) ga ZA RH45C 5,5 kVt qo'ygan, 13603 da
    # 500–550 Pa ga K3G. Shundan yuqori bosimda ventilyator yozilmaydi.
    ec_maks_bosim: 600
    # Katalog 2021, КЦКП «блок ячейковых фильтров»: hamma o'lchamda ФЯГ G4.
    # G3 so'ralsa ham standart G4 (menejer 13603 shunday qilgan); F5–F9 —
    # cho'ntakli ФЯК; F9 dan yuqori (HEPA) КЦКП ichida bo'lmaydi.
    filtr_standart: "ФяГ G4"
    filtr_kotarma: "ФяК"
    filtr_maks: "F9"
    izoh: "КЦКП sarf, bosim, isitish/sovutish bo'yicha tanlanadi"

  # Faqat seriya va nomer aniq bo'lganda nom yasaladi (ВРАН6 080 -> ВЦ 4-75-8,
  # ОСА 201 080 -> ВО 30-160-8; KP 13603). Dvigatel quvvati va ijrosi —
  # menejer tanlovi (TZ 15 kVt, menejer 18,5 kVt qo'ygan): nomga yozilmaydi.
  # Boshqa ventilyator — tanlov (`faqat_mos`).
  vent_sanoat:
    manba: "KP 13603 (ВРАН6 080 ДУ400 -> ВЦ 4-75-8-ДУ-400, ОСА 201 080 Н -> ВО 30-160-8)"
    faqat_mos: true
    qoliplar:
      # TZ da bizning seriya nomeri bilan («ВЦ4-75 №2.5», «ВЦ4-75-2,5 N=0,55»,
      # aeroport zayavkasi) — nom shu nomer bilan; dvigatel menejer tanlovi.
      - agar: 'ВЦ\s*4-75'
        ajrat: 'ВЦ\s*4-75\s*[-№N]*\s*(\d+(?:[.,]\d+)?)'
        qolip: "Вентилятор ВЦ 4-75-{x}"
        ogohlantirish: "dvigatel (kVt, ob/min) va bajarilishini TZ bo'yicha to'liq belgiga qo'shing"
      - agar: 'ВЦ\s*14-46'
        ajrat: 'ВЦ\s*14-46\s*[-№N]*\s*(\d+(?:[.,]\d+)?)'
        qolip: "Вентилятор ВЦ 14-46-{x}"
        ogohlantirish: "dvigatel (kVt, ob/min) va bajarilishini TZ bo'yicha to'liq belgiga qo'shing"
      - agar: 'ВРАН'
        qolip: "Вентилятор ВЦ 4-75-{nomer}{du}"
        ogohlantirish: "seriya ВЦ 4-75, dvigatel quvvati va ijrosi tanlansin"
      - agar: 'ОСА\s*\d'
        qolip: "Вентилятор ВО 30-160-{nomer}"
        ogohlantirish: "seriya ВО 30-160, dvigatel quvvati tanlansin"
    izoh: "Ventilyator sarf, bosim va dvigatel bo'yicha tanlanadi (ВЦ / ВО)"

  # Katalog 2021: prujinali vibroizolyatorlar ДО-38 … ДО-45.
  vibro:
    manba: "Katalog 2021 (Виброизоляторы ДО); aeroport zayavkasi ДО-38/39/40"
    faqat_mos: true
    qoliplar:
      - agar: 'ДО\s*-?\s*(3[89]|4[0-5])\b'
        ajrat: 'ДО\s*-?\s*(\d{2})'
        qolip: "Виброизолятор ДО-{x}"
    izoh: "Vibroizolyator — katalogda ДО-38…45, yuk bo'yicha tanlanadi"

  # VRF tashqi blok — modullar kombinatsiyasi. Faqat yig'indisi TZ quvvatiga
  # AYNAN (1,5% gacha) teng bo'lsa olinadi, eng kam modulli kombinatsiya.
  # Menejer KP larida shunday: 128,5 = 615T + 335T × 2; 156,5 = 615T × 2 +
  # 335T; 56 = 560T; 73 -> 725T. Aniq kombinatsiya bo'lmasa — tanlov.
  # Modul quvvati kod raqamidan (kVt × 10). Ro'yxat — KP larda uchragan
  # modullar; katalogda JVO yo'q, yangi modul shu yerga qo'shiladi.
  vrf_tashqi:
    manba: "KP 13173, 13321, 13508"
    modullar:
      - {kod: "JVO-335T", kvt: 33.5}
      - {kod: "JVO-560T", kvt: 56.0}
      - {kod: "JVO-615T", kvt: 61.5}
      - {kod: "JVO-680T", kvt: 68.0}
      - {kod: "JVO-725T", kvt: 72.5}
    maks_modul: 4
    farq_foizi: 1.5
    qolip: "Наружный блок VRF модель {kod}"
    izoh: "VRF tashqi blok quvvat bo'yicha tanlanadi (JVO) — aniq kombinatsiya topilmadi"

  # VRF ichki blok: kod = quvvat × 10 («JVI-071C» = 7,1 kVt). TZ quvvatidan
  # 5% gacha kichigi ham olinadi (14,07 -> 14,0), aks holda kattasi.
  # Kassetaga boshqaruv paneli qo'shiladi, devoriyga — yo'q (KP 13173,
  # 13321, 13508 — hammasida shunday). Turi aniqlanmasa — tanlov.
  vrf_ichki:
    manba: "KP 13173 (7,1 kasseta -> JVI-071C, 2,8 devoriy -> JVI-028W, напольно-потолочный -> C), KP 13321"
    olchamlar: [2.2, 2.8, 3.6, 4.5, 5.6, 7.1, 8.0, 9.0, 11.2, 14.0, 16.0]
    turlar:
      - agar: 'кассет|напольно|потолоч'
        qolip: "Внутренний блок кассетного типа VRF JVI-{kod}C"
        panel: true
      - agar: 'настен'
        qolip: "Внутренний блок настенные типа VRF JVI-{kod}W"
    panel: "Состав панели JHPEE-G-NK управления для мультизонального кондиционера входит: 1) JHYRE-T03H -панель; 2) JHYE-W01 -пульт."
    izoh: "VRF ichki blok quvvat va turi bo'yicha tanlanadi (JVI)"

  split:
    manba: "KP 13321 (2,64 -> 2,7 квт; 3,52 -> 3,6 квт)"
    olchamlar: [2.7, 3.6, 5.3, 7.0]
    qolip: "Сплит кондиционер {kvt} квт"
    izoh: "Split konditsioner quvvat bo'yicha tanlanadi (7 kVt dan katta — mini-VRF)"

  vrf_tizim:
    tanlov: true
    izoh: "VRF tizimi — bloklar so'rovnoma varaqasidan (ОЛ) tanlanadi"
